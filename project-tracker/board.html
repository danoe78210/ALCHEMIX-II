  function defaultTasks() {

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  async function loadTasks() {
    // La source de vérité est tasks.json (ou globalData en file://).
    // On essaie d'abord le fichier, sinon on retombe sur globalData.
    // Le cache localStorage n'est utilisé que s'il correspond à la version courante
    // (évite d'afficher un vieux cache obsolète, ex. ALC-005 resté "Backlog").
    const DATA_VERSION = (globalData.meta && globalData.meta.version) || '0';

    let loaded = false;

    // 1) Source : tasks.json (serveur / dev)
    try {
      const res = await fetch('tasks.json', { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data.tasks) && data.tasks.length) { state.tasks = data.tasks; loaded = true; }
      }
    } catch (e) { /* fetch indisponible (file://) */ }

    // 2) Fallback fichier absent → données locales intégrées (affichage immédiat en file://)
    if (!loaded) {
      state.tasks = defaultTasks();
      flash('Mode local (file://) : données intégrées ✓');
    }

    // 3) Un cache LOCAL n'est appliqué QUE s'il porte EXACTEMENT la version courante.
    //    Tout cache obsolète (sans version, ou version antérieure) est IGNORÉ :
    //    on garde la source de vérité (tasks.json / globalData) → évite un vieux "Backlog".
    const cached = localStorage.getItem('alchemix-board');
    if (cached) {
      try {
        const c = JSON.parse(cached);
        if (Array.isArray(c.tasks) && c.tasks.length && c.version === DATA_VERSION) {
          state.tasks = c.tasks; // cache à jour : respecte uniquement les interactions locales récentes
        }
      } catch (e) { /* cache illisible : on ignore */ }
    }
  }

  // ---- Hash léger (format unique, appliqué partout) ----
  function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
    return (h >>> 0).toString(16);
  }
  function tasksHash(tasks) {
    return hashString(JSON.stringify(tasks));
  }

    if (dot) { dot.style.animationPlayState = 'running'; }
  }

  // Écrit la référence partagée (source de vérité inter-onglets)
  function writeShared() {
    localStorage.setItem('alchemix-board', JSON.stringify({
      tasks: state.tasks,
      updatedAt: new Date().toISOString(),
      lastHash: tasksHash(state.tasks),
      version: DATA_VERSION()
    }));
  }

  // Valeur partagée sous forme objet (si présente et valide)
  function readShared() {
    try { const c = JSON.parse(localStorage.getItem('alchemix-board') || 'null'); return c; }
    catch (e) { return null; }
  }

  // ---- Fusion d'un jeu de tâches entrant, sans écraser une édition locale récente ----
  function applyRemoteTasks(remoteTasks) {
    const remoteHash = tasksHash(remoteTasks);
    const localHash = tasksHash(state.tasks);
    if (remoteHash === localHash) return false; // aucun changement

    // Si une édition locale vient d'avoir lieu, on laisse l'utilisateur finir (différé)
    if (Date.now() - lastLocalEdit < 1000) return 'defer';

    const agent = state.agent; // préserve le filtre agent
    state.tasks = remoteTasks;
    render();
    state.agent = agent;
    lastHash = remoteHash;
    writeShared();
    flashLive();
    return true;
  }

  // ---- Recharge depuis tasks.json (bouton / polling / focus) ----
  async function syncFromFile() {
    if (interacting) return 'defer';
    if (pollBusy) return 'busy';
    pollBusy = true;
    try {
      const res = await fetch('tasks.json', { cache: 'no-store' });
      if (!res.ok) return false;
      const data = await res.json();
      if (!Array.isArray(data.tasks) || !data.tasks.length) return false;
      return applyRemoteTasks(data.tasks);
    } catch (e) {
      // file:// : fetch inaccessible → on retombe sur un éventuel cache cross-tab
      const remote = readShared();
      if (remote && Array.isArray(remote.tasks) && remote.tasks.length &&
          remote.version === DATA_VERSION() && remote.lastHash !== lastHash) {
        return applyRemoteTasks(remote.tasks);
      }
      return false;
    } finally {
      pollBusy = false;
    }
  }

  function persist() {
    lastLocalEdit = Date.now();
    lastHash = tasksHash(state.tasks);
    writeShared();
  }

  function currentTasks() {
    return state.agent === 'all' ? state.tasks : state.tasks.filter((t) => t.agent === state.agent);
  }

  function cardHtml(t) {
    const agent = t.agent || '—';
    const color = AGENT_COLORS[agent] || '#9b8f80';
    const subs = t.subtasks || [];
    const doneCount = subs.filter((s) => s.completed).length;
    const progress = subs.length ? Math.round((doneCount / subs.length) * 100) : 0;
    const idx = COLUMNS.indexOf(t.status);

    const subtasksHtml = subs.map((s) => {
      const cbId = 'sub-' + t.id + '-' + s.id;
      return '<label for="' + cbId + '" class="flex items-start gap-2 rounded-md px-2 py-1 cursor-pointer hover:bg-surface-container transition-colors ' +
        (s.completed ? 'opacity-60' : '') + '">' +
        '<input type="checkbox" data-task="' + t.id + '" data-sub="' + s.id + '" id="' + cbId + '"' + (s.completed ? ' checked' : '') +
        ' class="mt-0.5 accent-[#edbf7a] cursor-pointer" />' +
        '<span class="text-[12px] leading-4 ' + (s.completed ? 'line-through text-outline' : 'text-on-surface-variant') + '">' + escapeHtml(s.title) + '</span>' +
        '</label>';
    }).join('');

    const prio = (t.priority || '');
    const prioBadge = prio ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ' +
      (prio === 'Haute' ? 'bg-error/10 text-[#ffb4ab]' : prio === 'Moyenne' ? 'bg-primary/10 text-primary' : 'bg-tertiary/10 text-tertiary') + '">' + escapeHtml(prio) + '</span>' : '';

    return '<article class="fade-in bg-surface-container rounded-xl shadow-[0_6px_20px_rgba(0,0,0,0.6)] border border-surface-container-high p-3 flex flex-col gap-2" data-id="' + t.id + '">' +
      '<div class="flex items-start justify-between gap-2">' +
        '<span class="font-mono text-[10px] font-bold tracking-wider text-outline">' + escapeHtml(t.id) + '</span>' +
        '<span class="text-[10px] font-bold uppercase tracking-wider" style="color:' + color + '">● ' + escapeHtml(agent) + '</span>' +
      '</div>' +
      '<h3 class="font-display text-[13px] font-bold leading-snug text-on-surface">' + escapeHtml(t.title) + '</h3>' +
      '<div class="flex items-center gap-2 flex-wrap">' + prioBadge +
        '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider" style="background:' + color + '1f;color:' + color + '">' + escapeHtml(t.label || '') + '</span>' +
      '</div>' +
      '<a href="ticket.html?id=' + encodeURIComponent(t.id) + '" class="inline-flex items-center gap-1.5 self-start px-2 py-1 rounded-md bg-surface-low hover:bg-surface-container-high border border-surface-container-high text-[10px] font-bold uppercase tracking-wider text-primary transition-colors" title="Ouvrir le journal du ticket">' +
        '<span>📓</span><span>Journal</span>' +
      '</a>' +
      (t.description ? '<p class="text-[12px] text-on-surface-variant leading-4">' + escapeHtml(t.description) + '</p>' : '') +
      '<div class="mt-1">' +
        '<div class="flex items-center justify-between text-[10px] font-mono text-outline mb-1"><span>Micro-tâches</span><span>' + doneCount + '/' + subs.length + ' · ' + progress + '%</span></div>' +
        '<div class="h-1.5 w-full bg-surface-low rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full transition-all duration-300" style="width:' + progress + '%"></div></div>' +
        '<div class="mt-2 flex flex-col gap-1 border-t border-surface-container-high pt-2">' + subtasksHtml + '</div>' +
      '</div>' +
      '<div class="flex items-center gap-1 mt-1">' +
        '<button data-move data-dir="left" data-id="' + t.id + '"' + (idx > 0 ? '' : ' disabled') +
          ' class="flex-1 text-center text-[11px] font-bold uppercase tracking-wide px-2 py-1 rounded-md bg-surface-low hover:bg-surface-container-high transition-colors disabled:opacity-30">←</button>' +
        '<button data-move data-dir="right" data-id="' + t.id + '"' + (idx < COLUMNS.length - 1 ? '' : ' disabled') +
          ' class="flex-1 text-center text-[11px] font-bold uppercase tracking-wide px-2 py-1 rounded-md bg-surface-low hover:bg-surface-container-high transition-colors disabled:opacity-30">→</button>' +
      '</div>' +
      '</article>';
  }

  function columnHtml(col) {
    const items = currentTasks().filter((t) => t.status === col);
    const titleColor = col === 'Terminé' ? 'text-tertiary' : col === 'En revue' ? 'text-secondary' : col === 'En cours' ? 'text-primary' : 'text-on-surface';
    return '<section class="bg-surface-low rounded-xl p-3 border border-surface-container-high">' +
      '<div class="flex items-center justify-between mb-3 px-1">' +
        '<h2 class="font-display text-[12px] font-bold uppercase tracking-widest ' + titleColor + '">' + col + '</h2>' +
        '<span class="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-[11px] font-mono text-on-surface-variant">' + items.length + '</span>' +
      '</div>' +
      '<div class="flex flex-col gap-3 min-h-[120px]">' +
        (items.map(cardHtml).join('') || '<p class="text-[12px] text-outline text-center italic py-4">Aucune tâche</p>') +
      '</div></section>';
  }
function render() {
    const board = document.getElementById('board');
    board.innerHTML = COLUMNS.map(columnHtml).join('');
    updateStats();
    renderSidebar();
    persist();
  }

  function updateStats() {
    document.getElementById('stat-total').textContent = state.tasks.length;
    const allSub = state.tasks.flatMap((t) => t.subtasks || []);
    document.getElementById('stat-sub').textContent = allSub.filter((s) => s.completed).length + '/' + allSub.length;
    document.getElementById('stat-review').textContent = state.tasks.filter((t) => t.status === 'En revue').length;
    document.getElementById('stat-done').textContent = state.tasks.filter((t) => t.status === 'Terminé').length;
  }

  // Couleurs associées aux statuts (pastilles)
  const STATUS_COLORS = {
    'Backlog': '#9b8f80',
    'En cours': '#edbf7a',
    'En revue': '#ffb59d',
    'Terminé': '#9cd1c6'
  };

  // ---- Sidebar : liste des tickets (triés par ID croissant) ----
  function renderSidebar() {
    const list = document.getElementById('ticket-list');
    if (!list) return;
    // Sidebar = uniquement le travail à accomplir : Backlog + En cours.
    // Terminé / En revue sont exclus pour alléger l'interface.
    const active = state.tasks.filter((t) => t.status === 'Backlog' || t.status === 'En cours');
    // Tri strict croissant par ID
    const sorted = active.slice().sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
    list.innerHTML = sorted.map((t) => {
      const color = STATUS_COLORS[t.status] || '#9b8f80';
      const done = (t.subtasks || []).filter((s) => s.completed).length;
      const total = (t.subtasks || []).length;
      return '<button data-sidebar-id="' + t.id + '" class="flex items-center gap-2 w-full text-left rounded-lg px-2 py-2 hover:bg-surface-container-high transition-colors group" title="Aller à ' + escapeHtml(t.id) + '">' +
        '<span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:' + color + ';box-shadow:0 0 8px ' + color + '88"></span>' +
        '<span class="flex flex-col min-w-0">' +
          '<span class="font-mono text-[10px] font-bold tracking-wider text-outline">' + escapeHtml(t.id) + '</span>' +
          '<span class="text-[12px] leading-4 text-on-surface truncate">' + escapeHtml(t.title) + '</span>' +
          '<span class="font-mono text-[9px] text-outline">' + done + '/' + total + ' ● ' + escapeHtml(t.status) + '</span>' +
        '</span>' +
        '<a href="ticket.html?id=' + encodeURIComponent(t.id) + '" class="shrink-0 px-1.5 py-1 ml-1 rounded text-[10px] text-primary hover:bg-surface-container-high transition-colors" title="Journal ' + escapeHtml(t.id) + '" onclick="event.stopPropagation()">📓</a>' +
      '</button>';
    }).join('') || '<p class="text-[12px] text-outline text-center italic py-4">Aucun ticket actif (Backlog / En cours)</p>';
  }

  // ---- Défilement fluide + surbrillance d'un ticket ----
  function scrollToTicket(id) {
    const card = document.querySelector('article[data-id="' + id + '"]');
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash-highlight');
    setTimeout(() => card.classList.remove('flash-highlight'), 1600);
  }

  // Règle : ne passer en REVIEW que si toutes les micro-tâches sont validées
  function updateMacroStatus(task) {
    const subs = task.subtasks || [];
    const allDone = subs.length > 0 && subs.every((s) => s.completed);
    if (allDone && task.status === 'En cours') {
      task.status = 'En revue';
      flash(task.id + ' : toutes les micro-tâches validées → En revue');
    } else if (task.status === 'En revue' && subs.length > 0 && !allDone) {
      task.status = 'En cours';
      flash(task.id + ' : micro-tâches incomplètes → réouverte en cours');
    }
  }

  function flash(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    setTimeout(() => { el.textContent = ''; }, 2400);
  }

  // ---- Événements (délégation) ----
  document.addEventListener('click', (e) => {
    // Clic sur un ticket de la sidebar → défilement fluide + surbrillance
    const sideItem = e.target.closest('[data-sidebar-id]');
    if (sideItem) { scrollToTicket(sideItem.dataset.sidebarId); return; }

    const agentBtn = e.target.closest('.agent-filter');
    if (agentBtn) {
      state.agent = agentBtn.dataset.agent;
      document.querySelectorAll('.agent-filter').forEach((b) => b.classList.remove('bg-surface-container-high'));
      if (state.agent === 'all') agentBtn.classList.add('bg-surface-container-high');
      render();
      return;
    }

    const moveBtn = e.target.closest('[data-move]');
    if (moveBtn) {
      const t = state.tasks.find((x) => x.id === moveBtn.dataset.id);
      if (t) {
        const idx = COLUMNS.indexOf(t.status);
        const next = moveBtn.dataset.dir === 'left' ? idx - 1 : idx + 1;
        if (next >= 0 && next < COLUMNS.length) { t.status = COLUMNS[next]; commit(); flash('Déplacé → ' + COLUMNS[next]); }
      }
      return;
    }

    const cb = e.target.closest('input[type=checkbox][data-task]');
    if (cb) {
      const task = state.tasks.find((x) => x.id === cb.dataset.task);
      const sub = task && (task.subtasks || []).find((s) => s.id === cb.dataset.sub);
      if (sub) { sub.completed = cb.checked; updateMacroStatus(task); commit(); }
      return;
    }

    if (e.target.closest('#btn-export')) {
      const blob = new Blob([JSON.stringify({ meta: { project: 'AlcheMix II', agents: Object.keys(AGENT_COLORS), columns: COLUMNS, updatedAt: new Date().toISOString() }, tasks: state.tasks }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tasks.json';
      a.click();
      flash('Exporté ✓');
      return;
    }

    if (e.target.closest('#btn-import')) { document.getElementById('file-input').click(); return; }
    if (e.target.closest('#btn-sync')) { syncFromFile(); return; }
  });

  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.tasks)) { state.tasks = data.tasks; render(); flash('Importé ✓'); }
        else throw new Error('clé "tasks" manquante');
      } catch (err) { alert('JSON invalide : ' + err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---- Commit : reflète toute modification, persiste et propage cross-tab ----
  function commit() {
    render();
    persist();
    // court verrou pour ne pas être écrasé pendant l'interaction en cours
    signalInteraction(true);
    setTimeout(() => signalInteraction(false), 300);
  }

  // ---- Synchronisation automatique (focus / visibilité / stockage / polling) ----
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { syncFromFile(); }
  });
  window.addEventListener('focus', () => { syncFromFile(); });
  // Cross-tab : un autre onglet a écrit dans localStorage → synchronise instantanément
  window.addEventListener('storage', (e) => {
    if (storageBusy || interacting || e.key !== 'alchemix-board' || !e.newValue) return;
    storageBusy = true;
    try {
      const c = JSON.parse(e.newValue);
      if (Array.isArray(c.tasks) && c.tasks.length && c.version === DATA_VERSION()) {
        // ré-très important : éviter d'écraser une édition locale fraîche
        if (Date.now() - lastLocalEdit < 500) return;
        const h = c.lastHash || tasksHash(c.tasks);
        if (h !== lastHash) { applyRemoteTasks(c.tasks); }
      }
    } catch (err) { /* ignore */ }
    finally { setTimeout(() => { storageBusy = false; }, 150); }
  });

  // ---- Initialisation ----
  (async function init() {
    await loadTasks();
    if (state.tasks.length === 0) state.tasks = defaultTasks();
    state.tasks.forEach((t) => {
      if (t.status === 'En revue' && (t.subtasks || []).some((s) => !s.completed)) t.status = 'En cours';
    });
    // initialise le hash courant (format unifié) pour ne pas re-rendre au premier poll
    lastHash = tasksHash(state.tasks);
    render();
    startPolling();
    // premier check immédiat (arrivée de modifications pendant le chargement)
    syncFromFile();
  })();

  // ---- Polling intelligent : vérifie tasks.json toutes les 1200 ms ----
  function startPolling() {
    setInterval(() => {
      const r = syncFromFile();
      // si différé (édition locale en cours), on retente rapidement
      if (r && typeof r.then === 'function') r.then((res) => { if (res === 'defer') { setTimeout(syncFromFile, 400); } });
    }, 1200);
    // petit battement visuel régulier même sans changement
    window.setInterval(() => {
      const dot = document.querySelector('.live-dot');
      if (dot) dot.style.animationPlayState = 'running';
    }, 600);
  }
</script>
</body>
