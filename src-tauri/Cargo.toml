[package]
name = "alchemix_ii"
version = "0.1.0"
description = "Console de mixage harmonique DJ propulsée par Tauri 2, Rust ONNX et Svelte 5."
authors = ["DJ Danoë"]
edition = "2021"

[lib]
name = "alchemix_ii_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "rt-multi-thread"] }
# Moteur d'analyse audio (ALC-008) : décodage Symphonia + FFT rustfft
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
# Décommenter pour inférence ONNX Demucs / Spleeter native :
# ort = { version = "2.0.0-rc.9", features = ["ndarray"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
