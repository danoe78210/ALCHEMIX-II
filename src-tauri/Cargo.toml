[package]
name = "alchemix_ii"
version = "0.7.0"
description = "Console de mixage harmonique DJ propulsée par Tauri 2, Rust ONNX et Svelte 5."
authors = ["DJ Danoë"]
edition = "2021"

[lib]
name = "alchemix_ii_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "rt-multi-thread"] }
# Moteur d'analyse audio (ALC-008) : décodage Symphonia + FFT rustfft
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
# Extraction des pochettes d'album embarquées (ALC-127)
lofty = "0.21"
base64 = "0.22"
# ALC-165 : catalogue local de la LIBRAIRIE (library_*).
# `bundled` intègre SQLite dans le binaire Tauri (aucune DLL sqlite3.dll à livrer, aucune
# dépendance buildtime_bindgen/libclang) : la compilation passe par le crate `cc`, qui
# s'appuie sur la toolchain C MSVC déjà présente.
rusqlite = { version = "0.43", features = ["bundled"] }
ort = { version = "2.0.0-rc.15", features = ["directml"] }
# SHA-256 des fichiers audio → clé de cache des Stems (ALC-174)
sha2 = "0.10"
# ALC-270 : téléchargement HTTP streaming du modèle GGUF (installation optionnelle ~1,9 Go)
# + inférence locale embarquée (llama-cpp-2, optionnelle derrière la feature `chef-llm`).
ureq = "2"
llama-cpp-2 = { version = "0.1", optional = true }

[features]
# Feature ALC-270 « chef-llm » : compile l'inférence llama-cpp-2 (modèle local + LoRA). Activée
# seulement pour la construction de l'installateur autonome (payload LLM réellement embarqué).
# Le build/`dev` par défaut (sans la feature) reste léger : l'IA Chef d'Orchestre fonctionne alors
# en mode déterministe (règles SQLite + partitions voisines), sans dépendance native lourde.
default = []
chef-llm = ["dep:llama-cpp-2"]

[profile.dev]
# ALC-159 : le décodage Symphonia, les FFT rustfft et les boucles DSP d'analyse tournent à pleine
# vitesse même en `tauri dev` (sinon opt-level=0 > 1 min d'analyse par morceau).
opt-level = 2
[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
